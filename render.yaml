# Render Blueprint Configuration (Infrastructure-as-Code)
# Platform: Render Cloud (PaaS)
# Service: Python Web Service (FastAPI)

services:
  - type: web
    name: student-information-portal
    runtime: python
    plan: free
    region: oregon # or frankfurt / singapore / ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
